<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">BrightMoto Aviation, Car and Bike Care</title><desc id="desc">A premium panoramic navy and gold BrightMoto banner with a private jet, blue luxury SUV, red sport motorcycle and care product lineup.</desc>
<defs>
