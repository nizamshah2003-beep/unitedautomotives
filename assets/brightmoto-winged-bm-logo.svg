<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-labelledby="title desc">
<title id="title">BrightMoto official BM winged emblem</title>
<desc id="desc">BrightMoto BM initials and BrightMoto wordmark inside a black oval badge with gold wings, matching the supplied brand reference.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff4c1"/><stop offset=".32" stop-color="#f5d46a"/><stop offset=".68" stop-color="#d49b27"/><stop offset="1" stop-color="#8b5b12"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#d8dce3"/><stop offset="1" stop-color="#8d96a2"/></linearGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g filter="url(#glow)">
 <path d="M211 82C159 48 97 39 25 49c48 7 92 22 137 47-44-14-91-15-136-5 65 8 119 27 166 58l20-19C183 103 145 83 103 75c42 2 76 14 112 31z" fill="url(#gold)" stroke="#ffe69a" stroke-width="2"/>
