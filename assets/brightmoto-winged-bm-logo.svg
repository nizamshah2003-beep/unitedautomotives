 <text x="280" y="131" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="900" font-style="italic" letter-spacing="-1" fill="#fff">Bright<tspan fill="url(#gold)">Moto</tspan></text>
 <text x="382" y="119" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="url(#gold)">™</text>
